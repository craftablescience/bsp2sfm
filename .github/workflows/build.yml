name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # nothing here

env:
  BUILD_DIR: '${{github.workspace}}/build'

jobs:
  build-windows:
    strategy:
      matrix:
        build_type:
          - Debug
          - Release
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -G "Ninja" -B "${{env.BUILD_DIR}}" -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DBSP2SFM_USE_LTO=ON

      - name: Build Binaries
        working-directory: '${{env.BUILD_DIR}}'
        run: |
          cmake --build . --config ${{matrix.build_type}} -t bsp2sfm -- -j%NUMBER_OF_PROCESSORS%

      - name: Upload Standalone
        uses: actions/upload-artifact@v7
        with:
          name: 'bsp2sfm-Windows-Standalone-msvc-${{matrix.build_type}}'
          path: |
            ${{env.BUILD_DIR}}/bsp2sfm.exe
            ${{env.BUILD_DIR}}/LICENSE
          retention-days: 7

      - name: Upload Standalone PDBs
        uses: actions/upload-artifact@v7
        with:
          name: 'bsp2sfm-Windows-PDBs-msvc-${{matrix.build_type}}'
          path: |
            ${{env.BUILD_DIR}}/bsp2sfm.pdb
          retention-days: 7

  build-linux:
    strategy:
      matrix:
        build_type:
          - Debug
          - Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Latest CMake
        uses: ssrobins/install-cmake@v1

      - name: Install Newer GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 13
          platform: x64

      - name: Configure CMake
        run: cmake -G "Ninja" -B "${{env.BUILD_DIR}}" -DCMAKE_C_COMPILER="gcc" -DCMAKE_CXX_COMPILER="g++" -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DBSP2SFM_USE_LTO=ON

      - name: Build Binaries
        working-directory: '${{env.BUILD_DIR}}'
        run: |
          cmake --build . --config ${{matrix.build_type}} -t bsp2sfm -- -j$(nproc)

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: 'bsp2sfm-Linux-gcc-${{matrix.build_type}}'
          path: |
            ${{env.BUILD_DIR}}/bsp2sfm
            ${{env.BUILD_DIR}}/LICENSE
          retention-days: 7
